name: Daily Good Morning Wish

on:
  schedule:
    # Runs at 6:00 AM IST (00:30 UTC) every day
    # IST is UTC+5:30, so 6:00 AM IST = 00:30 AM UTC
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  send-morning-wish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Send Good Morning Message
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MASTER_ID: ${{ secrets.DISCORD_MASTER_ID }}
          GEMINI_API_KEY: ${{ secrets.AI_BOT_TOKEN }}
        run: node sendGoodmorning.js
